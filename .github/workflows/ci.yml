name: ci

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './go.mod'
        check-latest: true
    - name: Build CSI driver
      run: make driver
    - name: Build sidecar mounter
      run: make sidecar-mounter
    - name: Build webhook
      run: make webhook
    - name: Build e2e test binary
      run: make build-e2e-test
  
  unit-test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './go.mod'
        check-latest: true
    - name: Test
      run: make unit-test
  
  sanity-test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './go.mod'
        check-latest: true
    - name: Test
      run: make sanity-test
  
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './go.mod'
        check-latest: true
    - name: Verify
      run: make verify
